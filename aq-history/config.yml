name: AQ History
slug: aq_history
description: >
  Serves Home Assistant recorder (MariaDB) history as JSON for custom
  Lovelace cards (e.g. the aq-room-card 7-day graphs).
version: "1.0.3"
url: "https://github.com/strid3r21/hassio-aq-history"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
ports:
  "8799": "8799"
options:
  db_host: mariadb
  db_port: 3306
  db_user: recorder
  db_password: ""
  db_name: homeassistant
  allowed_domains: sensor
schema:
  db_host: str
  db_port: int
  db_user: str
  db_password: str
  db_name: str
  allowed_domains: str
